<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">

        <h1 id="titulo"> Meu planejador de estudos</h1>

        <h2>Nova tarefa</h2>

        <input type="text" id="tarefa" placeholder="Digite o nome da tarefa">

        <input type="text" id="materia" placeholder="Digite o nome da matéria">

        <select id="prioridade">
            <option value="">Selecione a prioridade</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
        </select>

        <button onclick="adicionarTarefa()">
            Adicionar tarefa
        </button>

        <button onclick="limparCampos()">
            Limpar tarefas
        </button>

        <p id="mensagem"></p>

        <div class="contadores">
            <p id="contador">Tarefas cadastradas: 0</p>
            <p id="contadorConcluidas">Tarefas concluídas: 0</p>
        </div>

        <button onclick="alternarModo()">
            Modo de concentração
        </button>

        <h2>Minhas tarefas</h2>

        <div id="listaTarefas"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
