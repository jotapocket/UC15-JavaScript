<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaAê | Faça sua crítica</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
        <h1>AvaliaAê</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="critica.html">Críticas</a></li>
        </ul>
    </nav>

    <main class="pagina-critica">
        <h2>Deixe sua crítica</h2>
        <p>Avalie cada categoria com uma nota de 0 a 10.</p>

        <form id="criticaForm">
            <label for="nome">Seu nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="filme">Nome do filme:</label>
            <input type="text" id="filme" name="filme" required>

            <label for="roteiro">Roteiro:</label>
            <input type="number" id="roteiro" name="roteiro" min="0" max="10" step="0.1" required>

            <label for="atuacao">Atuação:</label>
            <input type="number" id="atuacao" name="atuacao" min="0" max="10" step="0.1" required>

            <label for="fotografia">Fotografia:</label>
            <input type="number" id="fotografia" name="fotografia" min="0" max="10" step="0.1" required>

            <label for="trilha">Trilha sonora:</label>
            <input type="number" id="trilha" name="trilha" min="0" max="10" step="0.1" required>

            <label for="direcao">Direção:</label>
            <input type="number" id="direcao" name="direcao" min="0" max="10" step="0.1" required>

            <button class="botao" type="submit">Calcular média</button>
        </form>

        <section id="resultadoCritica" hidden>
            <h3>Resultado da crítica</h3>
            <p id="media"></p>
            <p id="classificacao"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AvaliaAê. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
